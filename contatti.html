<body>

   <header class="header">
       <a href="/" class="logo"> MENU</a>
       <input class="menu-btn" type="checkbox" id="menu-btn">
       <label for="menu-btn" class="menu-icon">
           <span class="navicon"></span>

        <ul class="menu">
            <li><a class="herf"  href="index.html">Portfolio</a></li>

            <li><a class="herf"  href="contatti.html">Contatti</a></li>

      <form id="form-contatti" method="POST" class="contatti-fine">
                        <div class="info-contatti">
                            <h3 class="title"> Contattami! </h3>
                         <div class="contatti-fine">
                            <label for="inputNome" class="text-4">Nome</label>
                            <input type="text" class="input-field" id="inputNome" name="name" placeholder="Inserisci il tuo nome" required>
                        </div>
                        
                        <div class="contatti-fine">
                            <label for="inputEmail" class="text-4">Email</label>
                            <input type="email" class="input-field" id="inputEmail" name="email" placeholder="nome@esempio.com" required>
                        </div>
                        
                        <div class="contatti-fine">
                            <label for="inputMessaggio" class="text-4">Messaggio</label>
                            <textarea class="input-field" id="inputMessaggio" name="message" rows="4" placeholder="Scrivi qui il tuo messaggio" required></textarea>
                        </div>
                        
                        <button type="submit" class="btn">Invia</button>
                        <p id="form-status"></p>
                    </div>
                      

                
                <div class="links">
                    <a class="contattilink" href="https://www.linkedin.com/in/alessia-nicoletti-26951b22b/" target="_blank">
                        <img class="contatti-img" src="https://i.pinimg.com/736x/49/32/80/49328097f84b5b6d80ffe0c104e4f429.jpg" alt="LinkedIn">
                    </a>
                    <a class="contattilink" href="https://github.com/alessianicoletti0-jpg" target="_blank">
                        <img class="contatti-img" src="https://i.pinimg.com/736x/ec/3a/60/ec3a60c8c6539a07eb70b52f6737ea6e.jpg" alt="GitHub">
                    </a>
                    <a class="contattilink" href="https://www.figma.com/proto/cLTXilf27PRIZUnrrnyCJC/Portfolio-Alessia?node-id=2-5&t=oIQrNVhdaL1PYvyC-0&scaling=min-zoom&content-scaling=fixed&page-id=2%3A5&starting-point-node-id=135%3A701" target="_blank">
                        <img class="contatti-img" src="https://i.pinimg.com/736x/9f/4c/25/9f4c2598ee3f12d78d35065639f8e243.jpg" alt="GitHub">
                    </a>
                </div>    
</form>

<script type="text/javascript">
    emailjs.init({ publicKey: "vCjWOJb6SdU4wLjjq" });

    const form = document.getElementById("form-contatti");
    const status = document.getElementById("form-status");

    form.addEventListener("submit", function (e) {
        e.preventDefault(); 

        status.textContent = "Invio in corso...";

        emailjs.sendForm("service_s47cjc1", "template_ijgxxm9", form)
            .then(() => {
                status.textContent = "Messaggio inviato, grazie!";
                form.reset();
            })
            .catch((error) => {
                status.textContent = "Errore nell'invio, riprova più tardi.";
                console.error("EmailJS error:", error);
            });
    });
</script>
